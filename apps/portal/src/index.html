<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>App Speed</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
      /* Shared by the pre-bootstrap markup above and AppComponent until the first navigation settles. */
      .app-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: var(--mat-sys-surface, #fff);
      }
      .app-loader__spinner {
        width: 40px;
        height: 40px;
        box-sizing: border-box;
        border: 4px solid var(--mat-sys-surface-container-highest, #e3e3e3);
        border-top-color: var(--mat-sys-primary, #0b57d0);
        border-radius: 50%;
        animation: app-loader-spin 0.8s linear infinite;
      }
      .app-loader__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader__spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body class="mat-typography">
    <app-root>
      <div class="app-loader" role="status">
        <span class="app-loader__spinner" aria-hidden="true"></span>
        <span class="app-loader__label">Loading App Speed…</span>
      </div>
    </app-root>
  </body>
</html>
