name: CI

env:
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 10.11.0

on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      capture_visual_baselines:
        description: Capture Linux visual baselines for review (does not compare snapshots)
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  setup:
    name: Setup CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint Affected
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint Affected
        run: pnpm exec nx affected --target=lint --parallel=3

  effect-diagnostics:
    name: Effect Diagnostics Affected
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Effect Diagnostics
        run: pnpm exec nx affected --target=effect:diagnostics --parallel=3

  test:
    name: Test Affected
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Affected
        run: pnpm exec nx affected --target=test --parallel=3

  build:
    name: Build Affected
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Affected
        run: pnpm exec nx affected -t build --parallel=3

  integration:
    name: Integration Affected
    needs: setup
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      RUNNER_MANAGER_MODE: manual
      RUNNER_HEADLESS: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Integration Affected
        run: pnpm exec nx affected --target=integration --parallel=1
      - name: Upload Integration Diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-diagnostics
          path: artifacts/test-orchestration/integration/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_visual_baselines && 'Capture Visual Baselines' || 'E2E Affected' }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      RUNNER_MANAGER_MODE: local
      RUNNER_HEADLESS: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v3
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Browser Artifacts
        run: pnpm exec nx run-many -t install-browser,install-cypress -p test-orchestration,portal-e2e
      - name: Run E2E Affected
        if: github.event_name != 'workflow_dispatch' || !inputs.capture_visual_baselines
        run: pnpm exec nx affected --target=e2e --parallel=1
      - name: Capture Linux Baselines
        if: github.event_name == 'workflow_dispatch' && inputs.capture_visual_baselines
        run: pnpm exec nx run portal-e2e:e2e --configuration=update-snapshots
      - name: Upload Linux Baselines for Review
        if: github.event_name == 'workflow_dispatch' && inputs.capture_visual_baselines && success()
        uses: actions/upload-artifact@v6
        with:
          name: linux-visual-baselines
          path: docs/screenshots/workspace-journeys/baselines/linux/
          if-no-files-found: error
      - name: Upload E2E Screenshots and Diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-diagnostics
          path: |
            artifacts/test-orchestration/e2e/
            artifacts/workspace-visuals/
            dist/cypress/apps/portal-e2e/screenshots/
            dist/cypress/apps/portal-e2e/videos/
          if-no-files-found: ignore
          retention-days: 7
